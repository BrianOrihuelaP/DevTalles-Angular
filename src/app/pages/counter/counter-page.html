<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <section class="counterContainer">
    <section class="displayCounter">
      <h1>{{this.counterSignal()}}</h1>
    </section>
    <section class="sectionButtons">
      <button (click)="increaseBy(1)">Increase + 1</button>
      <button (click)="decreaseBy(1)">Decrease - 1</button>
      <button (click)="resetCounter()">Reset</button>
    </section>
    <p> Angular Counter</p>
  </section>
</body>

</html>
